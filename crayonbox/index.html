<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="version" content="v2-fix-init+sw">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrayonBox">
<meta name="theme-color" content="#F4EAD5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/main.css">
<title>CrayonBox</title>
<style>
#screen-book-carousel.active { display: flex; }
#screen-workspace.active { display: flex; }
</style>
</head>
<body>
<div id="loading" class="loading">CrayonBox</div>

<div id="app">
  <!-- Book Carousel -->
  <div id="screen-book-carousel" class="screen active">
    <div class="book-container" id="bookContainer">
      <div class="book-spread" id="bookSpread">
        <div class="book-page book-page-left" id="pageLeft"></div>
        <div class="book-spine"></div>
        <div class="book-page book-page-right" id="pageRight"></div>
      </div>
    </div>
    <div class="page-nav">
      <button class="page-nav-btn" id="prevPageBtn">◀</button>
      <button class="page-nav-btn" id="nextPageBtn">▶</button>
    </div>
    <div class="page-indicator" id="pageIndicator">Page 1 of 8</div>
    <div class="book-buttons">
      <button class="gallery-btn" id="galleryBtn" aria-label="My Artwork">♥</button>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="screen-gallery" class="screen">
    <div class="gallery-header">
      <button id="galleryBackBtn" aria-label="Back to book">◀</button>
      <span>My Artwork</span>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- Workspace Canvas -->
  <div id="screen-workspace" class="screen">
    <div class="workspace-header">
      <button id="backBtn" aria-label="Back to book">📖</button>
      <button id="undoBtn" class="undo-icon" aria-label="Undo last stroke">↶</button>
      <button id="clearBtn" class="trash-icon" aria-label="Clear page">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#F4EAD5" stroke-width="2">
          <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
        </svg>
        <div class="clear-progress" id="clearProgress"></div>
      </button>
    </div>
    <div class="canvas-container">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="crayon-canvas"></canvas>
        <div class="coloring-svg-overlay" id="coloringSvg">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536">
            <!-- Butterfly body -->
            <ellipse cx="1024" cy="768" rx="20" ry="80" fill="none" stroke="#1A1817" stroke-width="8" stroke-linecap="round"/>
            <!-- Antennae -->
            <path d="M1010 700 Q980 620 960 580" fill="none" stroke="#1A1817" stroke-width="6" stroke-linecap="round"/>
            <path d="M1038 700 Q1068 620 1088 580" fill="none" stroke="#1A1817" stroke-width="6" stroke-linecap="round"/>
            <circle cx="958" cy="576" r="8" fill="none" stroke="#1A1817" stroke-width="5"/>
            <circle cx="1090" cy="576" r="8" fill="none" stroke="#1A1817" stroke-width="5"/>
            <!-- Upper left wing -->
            <path d="M1000 720 Q800 500 600 600 Q550 650 650 750 Q800 780 1000 760 Z" fill="none" stroke="#1A1817" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="800" cy="650" r="40" fill="none" stroke="#1A1817" stroke-width="5"/>
            <circle cx="750" cy="700" r="25" fill="none" stroke="#1A1817" stroke-width="4"/>
            <circle cx="850" cy="620" r="20" fill="none" stroke="#1A1817" stroke-width="4"/>
            <!-- Upper right wing -->
            <path d="M1048 720 Q1248 500 1448 600 Q1498 650 1398 750 Q1248 780 1048 760 Z" fill="none" stroke="#1A1817" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="1250" cy="650" r="40" fill="none" stroke="#1A1817" stroke-width="5"/>
            <circle cx="1300" cy="700" r="25" fill="none" stroke="#1A1817" stroke-width="4"/>
            <circle cx="1200" cy="620" r="20" fill="none" stroke="#1A1817" stroke-width="4"/>
            <!-- Lower-left wing -->
            <path d="M1000 800 Q850 950 700 900 Q620 850 700 800 Q850 840 1000 820 Z" fill="none" stroke="#1A1817" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="820" cy="850" r="18" fill="none" stroke="#1A1817" stroke-width="4"/>
            <!-- Lower-right wing -->
            <path d="M1048 800 Q1198 950 1348 900 Q1428 850 1348 800 Q1198 840 1048 820 Z" fill="none" stroke="#1A1817" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="1230" cy="850" r="18" fill="none" stroke="#1A1817" stroke-width="4"/>
          </svg>
        </div>
        <div class="color-swatch" id="colorSwatch" style="background:#EF4444"></div>
      </div>
    </div>
    <div class="crayon-palette" id="crayonPalette"></div>
  </div>

  <!-- Rotate Device Overlay -->
  <div id="rotateOverlay" class="rotate-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">Rotate your device</div>
    <div class="rotate-sub">Landscape mode is best for coloring</div>
  </div>
</div>

<script src="js/render/paper-texture.js"></script>
<script src="js/render/shaders.js"></script>
<script src="js/render/webgl-engine.js"></script>
<script src="js/input/pointer-handler.js"></script>
<script src="js/input/gesture-detector.js"></script>
<script src="js/audio/sound-engine.js"></script>
<script src="js/db/storage.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.warn);
}
</script>
</body>
</html>
