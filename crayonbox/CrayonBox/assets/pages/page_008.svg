<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536">
  <!-- Dinosaur body -->
  <ellipse cx="950" cy="900" rx="280" ry="150" fill="none" stroke="#1A1817" stroke-width="8"/>
  <!-- Tail -->
  <path d="M670 900 Q500 800 400 600 Q450 700 600 850" fill="none" stroke="#1A1817" stroke-width="8" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M1150 850 Q1300 600 1350 450" fill="none" stroke="#1A1817" stroke-width="10" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="1400" cy="420" rx="80" ry="60" fill="none" stroke="#1A1817" stroke-width="8"/>
  <!-- Jaw -->
  <path d="M1400 460 Q1450 500 1480 480" fill="none" stroke="#1A1817" stroke-width="6" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="1420" cy="405" r="10" fill="none" stroke="#1A1817" stroke-width="5"/>
  <!-- Nostril -->
  <circle cx="1460" cy="415" r="4" fill="none" stroke="#1A1817" stroke-width="3"/>
  <!-- Smile -->
  <path d="M1440 440 Q1460 455 1470 445" fill="none" stroke="#1A1817" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="750" y="1020" width="70" height="120" rx="20" fill="none" stroke="#1A1817" stroke-width="7"/>
  <rect x="1050" y="1020" width="70" height="120" rx="20" fill="none" stroke="#1A1817" stroke-width="7"/>
  <!-- Feet -->
  <ellipse cx="785" cy="1140" rx="50" ry="15" fill="none" stroke="#1A1817" stroke-width="6"/>
  <ellipse cx="1085" cy="1140" rx="50" ry="15" fill="none" stroke="#1A1817" stroke-width="6"/>
  <!-- Spikes on back -->
  <path d="M800 780 L780 700 L830 770" fill="none" stroke="#1A1817" stroke-width="6" stroke-linejoin="round"/>
  <path d="M900 770 L890 680 L940 760" fill="none" stroke="#1A1817" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1000 770 L1000 680 L1050 760" fill="none" stroke="#1A1817" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1100 780 L1110 700 L1150 770" fill="none" stroke="#1A1817" stroke-width="6" stroke-linejoin="round"/>
  <path d="M700 850 L660 770 L720 840" fill="none" stroke="#1A1817" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1180 810 L1200 740 L1220 805" fill="none" stroke="#1A1817" stroke-width="5" stroke-linejoin="round"/>
  <!-- Belly line -->
  <path d="M750 950 Q950 1020 1150 950" fill="none" stroke="#1A1817" stroke-width="5"/>
  <!-- Ground line -->
  <path d="M300 1150 L1700 1150" fill="none" stroke="#1A1817" stroke-width="6"/>
</svg>