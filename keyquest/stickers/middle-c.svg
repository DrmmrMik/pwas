<svg xmlns="http://www.w3.org/2000/svg" width="80mm" height="60mm" viewBox="0 0 80 60">
  <title>Key Quest Middle C sticker — print, cut out and stick on Middle C</title>
  <g transform="translate(5 5)">
    <path d="M10 0 L20 9 L0 9 Z" fill="#ff7a59"/><rect x="3" y="8.5" width="14" height="11" fill="#ffd36e" stroke="#5b2f14" stroke-width="1"/><rect x="8.2" y="13" width="3.6" height="6.5" fill="#7a4b2a"/>
    <text x="10" y="27" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="6">C</text>
  </g>
  <g transform="translate(30 5)">
    <path d="M10 0 L20 9 L0 9 Z" fill="#ff7a59"/><rect x="3" y="8.5" width="14" height="11" fill="#ffd36e" stroke="#5b2f14" stroke-width="1"/><rect x="8.2" y="13" width="3.6" height="6.5" fill="#7a4b2a"/>
    <text x="10" y="27" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="6">C</text>
  </g>
  <text x="40" y="52" text-anchor="middle" font-family="sans-serif" font-size="4">Cut out one house and stick it on Middle C (the C closest to the middle of the piano).</text>
</svg>
