<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241442"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Antenna -->
  <line x1="256" y1="170" x2="256" y2="100" stroke="#F1C40F" stroke-width="14" stroke-linecap="round"/>
  <polygon points="256,60 268,90 300,90 274,110 284,140 256,122 228,140 238,110 212,90 244,90" fill="#FFEAA7" stroke="#F39C12" stroke-width="4" filter="url(#glow)"/>

  <!-- Body -->
  <rect x="156" y="270" width="200" height="170" rx="50" fill="#2ED573" stroke="#26AF5F" stroke-width="10"/>
  <!-- Belly Panel -->
  <rect x="186" y="300" width="140" height="110" rx="30" fill="#FF6B81" stroke="#26AF5F" stroke-width="6"/>
  <!-- Heart Icon on Belly -->
  <path d="M256,380 C230,350 210,330 210,315 C210,300 225,290 240,290 C250,290 254,296 256,300 C258,296 262,290 272,290 C287,290 302,300 302,315 C302,330 282,350 256,380 Z" fill="#FF4757" filter="url(#glow)"/>

  <!-- Head -->
  <rect x="146" y="140" width="220" height="150" rx="50" fill="#2ED573" stroke="#26AF5F" stroke-width="10"/>
  
  <!-- Button Ears -->
  <circle cx="130" cy="215" r="22" fill="#FF6B81" stroke="#26AF5F" stroke-width="6"/>
  <circle cx="382" cy="215" r="22" fill="#FF6B81" stroke="#26AF5F" stroke-width="6"/>

  <!-- Eyes -->
  <circle cx="205" cy="205" r="24" fill="#2F3542"/>
  <circle cx="307" cy="205" r="24" fill="#2F3542"/>
  <circle cx="198" cy="198" r="9" fill="#FFFFFF"/>
  <circle cx="300" cy="198" r="9" fill="#FFFFFF"/>
  <circle cx="212" cy="212" r="4" fill="#FFFFFF"/>
  <circle cx="314" cy="212" r="4" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="185" cy="235" rx="14" ry="8" fill="#FF6B81" opacity="0.8"/>
  <ellipse cx="327" cy="235" rx="14" ry="8" fill="#FF6B81" opacity="0.8"/>

  <!-- Smile -->
  <path d="M236,240 Q256,260 276,240" stroke="#2F3542" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
